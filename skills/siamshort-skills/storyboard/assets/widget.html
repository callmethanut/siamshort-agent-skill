<h2 class="sr-only">Storyboard prompt generator form: choose title, video format, story, art style, panel count, panel shape and options, then submit to have Claude write a GPT Images 2.0 prompt for a Seedance 2.0 reference storyboard.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Storyboard details</span>
  </div>
  <div class="elicit-body">

    <div class="elicit-group">
      <label class="elicit-question">What's the storyboard title? (required)</label>
      <textarea class="elicit-textarea" data-name="title" placeholder="e.g. Midnight bakery — 30 second teaser" style="min-height:44px"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What kind of video is this? (required)</label>
      <div class="elicit-pills" data-name="video_format" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Story" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:188px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-book" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Story</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Narrative with an arc</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="CM / advertising" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:188px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-speakerphone" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">CM / advertising</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Product or brand spot</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Educational / explainer" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:188px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-school" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Educational / explainer</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Teach or explain something</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Information" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:188px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-news" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Information</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">News, updates, awareness</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Entertainment" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:188px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-confetti" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Entertainment</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Fun, gags, variety</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Art / expression" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:188px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-palette" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Art / expression</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Mood and visuals first</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:188px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-dots" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Other</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Describe your own</span></span>
        </button>
      </div>
      <input type="text" class="elicit-other" data-for="video_format" placeholder="Describe the video format" hidden>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What happens in the story?</label>
      <textarea class="elicit-textarea" data-name="summary" placeholder="1–5 sentences. Leave blank and I'll invent a story from the title and format."></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">If you wrote a summary, how should I treat it?</label>
      <div class="elicit-pills" data-name="summary_handling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Polish and expand it">Polish and expand it</button>
        <button type="button" class="elicit-pill" data-value="Use it exactly as written">Use it exactly as written</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Which art style?</label>
      <div class="elicit-pills" data-name="art_style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Anime — high-quality Japanese" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:158px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-brush" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Anime — Japanese</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Crisp lineart, cinematic color</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Anime — Pixar-style 3D" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:158px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-box" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Anime — Pixar-style 3D</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Soft 3D, expressive faces</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Live action" style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:158px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-video" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Live action</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Photoreal film stills</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:13px 15px; display:flex; gap:11px; align-items:flex-start; text-align:left; min-width:158px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-dots" style="font-size:19px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Other</span><br><span style="font-size:11px; color:var(--color-text-tertiary)">Describe your own</span></span>
        </button>
      </div>
      <input type="text" class="elicit-other" data-for="art_style" placeholder="Describe the style, e.g. watercolor picture book, 90s retro anime" hidden>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">How many panels? (13 or more get split across two sheets)</label>
      <div class="elicit-pills" data-name="panel_count" data-multi="false">
        <button type="button" class="elicit-pill" data-value="4">4</button>
        <button type="button" class="elicit-pill" data-value="6">6</button>
        <button type="button" class="elicit-pill" data-value="8">8</button>
        <button type="button" class="elicit-pill" data-value="9">9</button>
        <button type="button" class="elicit-pill" data-value="12">12</button>
        <button type="button" class="elicit-pill" data-value="16">16</button>
        <button type="button" class="elicit-pill" data-value="20">20</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="panel_count" placeholder="Any number from 4 to 20" hidden>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Panel shape — match your final video</label>
      <div class="elicit-pills" data-name="panel_shape" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Landscape 16:9" style="width:118px; border-radius:12px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <svg width="48" height="36" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="8" y="9" width="32" height="18" rx="2"/></svg>
          <span style="font-size:13px; font-weight:500">Landscape</span>
          <span style="font-size:11px; color:var(--color-text-tertiary)">16:9 — YouTube, TV</span>
        </button>
        <button type="button" class="elicit-pill" data-value="Portrait 9:16" style="width:118px; border-radius:12px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <svg width="48" height="36" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="15" y="2" width="18" height="32" rx="2"/></svg>
          <span style="font-size:13px; font-weight:500">Portrait</span>
          <span style="font-size:11px; color:var(--color-text-tertiary)">9:16 — Shorts, Reels</span>
        </button>
        <button type="button" class="elicit-pill" data-value="Square 1:1" style="width:118px; border-radius:12px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <svg width="48" height="36" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="10" y="4" width="28" height="28" rx="2"/></svg>
          <span style="font-size:13px; font-weight:500">Square</span>
          <span style="font-size:11px; color:var(--color-text-tertiary)">1:1 — feed posts</span>
        </button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What should the sheet include? (pick any)</label>
      <div class="elicit-pills" data-name="sheet_options" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Panel numbers">Panel numbers</button>
        <button type="button" class="elicit-pill" data-value="Action / camera / dialogue captions">Action / camera / dialogue captions</button>
        <button type="button" class="elicit-pill" data-value="Character sheet (separate image)">Character sheet (separate image)</button>
        <button type="button" class="elicit-pill" data-value="Print title on the sheet">Print title on the sheet</button>
        <button type="button" class="elicit-pill" data-value="B&W sketch look">B&amp;W sketch look (default is full color)</button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Main characters? Locking them keeps designs consistent panel to panel</label>
      <textarea class="elicit-textarea" data-name="characters" placeholder="One per line — Name: age, look, outfit. Leave blank and I'll design them."></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What's the mood? (pick up to two)</label>
      <div class="elicit-pills" data-name="mood" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Heartwarming">Heartwarming</button>
        <button type="button" class="elicit-pill" data-value="Epic">Epic</button>
        <button type="button" class="elicit-pill" data-value="Tense">Tense</button>
        <button type="button" class="elicit-pill" data-value="Comedic">Comedic</button>
        <button type="button" class="elicit-pill" data-value="Melancholic">Melancholic</button>
        <button type="button" class="elicit-pill" data-value="Dark">Dark</button>
        <button type="button" class="elicit-pill" data-value="Hopeful">Hopeful</button>
        <button type="button" class="elicit-pill" data-value="Stylish">Stylish</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="mood" placeholder="Describe the mood" hidden>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What language for text on the sheet?</label>
      <div class="elicit-pills" data-name="sheet_text_language" data-multi="false">
        <button type="button" class="elicit-pill" data-value="English">English (most reliable)</button>
        <button type="button" class="elicit-pill" data-value="Japanese">Japanese</button>
        <button type="button" class="elicit-pill" data-value="Thai">Thai</button>
        <button type="button" class="elicit-pill" data-value="No text">No text on the sheet</button>
      </div>
    </div>

  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Generate prompt</button>
  </div>
</form>
